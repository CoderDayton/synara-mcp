name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded PR runs, but let main-branch runs finish so we
  # always have a complete signal on the protected branch.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-check:
    name: Python · lint + types + security
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install (locked)
        run: uv sync --locked

      - name: Cache mypy
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ hashFiles('src/**/*.py') }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}-
            mypy-${{ runner.os }}-

      - name: ruff format --check
        run: uv run --frozen ruff format --check src tests

      - name: ruff check
        run: uv run --frozen ruff check src tests

      - name: mypy
        run: uv run --frozen mypy

      - name: bandit
        run: uv run --frozen bandit -q -r src

  python-test:
    name: Python · test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install (locked)
        run: uv sync --locked

      - name: pytest
        run: uv run --frozen pytest -q --junit-xml=pytest.xml

      - name: Upload junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest
          path: pytest.xml
          if-no-files-found: warn

  dashboard:
    name: Dashboard · typecheck + lint + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('dashboard/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Set up uv (build-freshness check is a Python script)
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install Python deps
        run: uv sync --locked

      - name: Install JS deps
        working-directory: dashboard
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: dashboard
        run: bun run typecheck

      - name: Lint
        working-directory: dashboard
        run: bun run lint

      - name: Test
        working-directory: dashboard
        run: bun run test

      - name: Verify committed static bundle is fresh
        run: uv run --frozen python scripts/check_dashboard_build.py

  package:
    name: Package · build + install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Build sdist + wheel
        run: uv build --no-sources

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      # Guards the two ways the artifacts silently rot: the wheel losing
      # the committed dashboard bundle, and the sdist picking up whatever
      # untracked files happen to sit in the tree (see the explicit
      # include list in pyproject.toml).
      - name: Verify artifact contents
        run: |
          set -euo pipefail
          static_files="$(unzip -l dist/*.whl | grep -c 'synara/features/dashboard/static/' || true)"
          if [ "$static_files" -lt 2 ]; then
            echo "::error::wheel is missing the dashboard static bundle"
            exit 1
          fi
          echo "wheel ships $static_files dashboard static files"

          if tar tzf dist/*.tar.gz | grep -q 'node_modules/'; then
            echo "::error::sdist contains node_modules"
            exit 1
          fi
          sdist_files="$(tar tzf dist/*.tar.gz | wc -l)"
          echo "sdist ships $sdist_files files"

      - name: Install the wheel into a clean environment
        run: |
          set -euo pipefail
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl

      - name: Import the installed package
        run: |
          /tmp/smoke/bin/python -c "
          from importlib.metadata import entry_points, version
          import synara.main, synara.server
          print('installed synara-mcp', version('synara-mcp'))
          (ep,) = entry_points(group='console_scripts', name='synara-mcp')
          ep.load()
          print('entry point resolves:', ep.value)
          "

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
