version: 2

updates:
  # Workflow actions drifted a full major behind before anyone noticed;
  # let dependabot carry them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dev:
        dependency-type: development
      python-runtime:
        dependency-type: production
        # simplevecdb is pinned below 3 on purpose (private-API coupling,
        # see pyproject.toml); a major bump needs a human.
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dashboard:
        patterns: ["*"]
        update-types: ["minor", "patch"]
