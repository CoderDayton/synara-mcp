version: 2

updates:
  # Workflow actions drifted a full major behind before anyone noticed;
  # let dependabot carry them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dev:
        dependency-type: development
      python-runtime:
        dependency-type: production
        # simplevecdb is pinned below 3 on purpose (private-API coupling,
        # see pyproject.toml); a major bump needs a human.
        update-types: ["minor", "patch"]

  # bun, not npm: the dashboard's lockfile is `bun.lock` and CI installs
  # it with `bun install --frozen-lockfile`. Under the npm ecosystem
  # dependabot maintained `package-lock.json` instead, so every bump
  # landed with a lockfile CI never reads and a `bun.lock` that no longer
  # matched `package.json`.
  - package-ecosystem: bun
    directory: /dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dashboard:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 (the native port) is ahead of its linter: every
      # released typescript-eslint still declares `typescript <6.1.0` as
      # its peer, and `eslint .` hard-crashes inside typescript-estree
      # under TS 7. Lift this once typescript-eslint ships TS 7 support.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
