<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     role="img" aria-labelledby="synara-title synara-desc">
  <title id="synara-title">Synara</title>
  <desc id="synara-desc">A warm amber memory hub linked by spokes to six indigo episode nodes on a deep midnight field.</desc>

  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Field with seal: outer stroke + inner hairline -->
  <circle cx="12" cy="12" r="11.5" fill="#0B1020"/>
  <circle cx="12" cy="12" r="11.3" fill="none" stroke="#818CF8" stroke-width="0.4"/>
  <circle cx="12" cy="12" r="10.5" fill="none" stroke="#818CF8" stroke-opacity="0.28" stroke-width="0.18"/>

  <!-- Recall spokes -->
  <g stroke="#67E8F9" stroke-opacity="0.55" stroke-width="0.75" stroke-linecap="round">
    <line x1="12" y1="12" x2="12" y2="4"/>
    <line x1="12" y1="12" x2="18.93" y2="8"/>
    <line x1="12" y1="12" x2="18.93" y2="16"/>
    <line x1="12" y1="12" x2="12" y2="20"/>
    <line x1="12" y1="12" x2="5.07" y2="16"/>
    <line x1="12" y1="12" x2="5.07" y2="8"/>
  </g>

  <!-- Episode nodes -->
  <g fill="#A5B4FC">
    <circle cx="12" cy="4" r="1.3"/>
    <circle cx="18.93" cy="8" r="1.3"/>
    <circle cx="18.93" cy="16" r="1.3"/>
    <circle cx="12" cy="20" r="1.3"/>
    <circle cx="5.07" cy="16" r="1.3"/>
    <circle cx="5.07" cy="8" r="1.3"/>
  </g>

  <!-- Memory hub -->
  <circle cx="12" cy="12" r="3.5" fill="url(#halo)"/>
  <circle cx="12" cy="12" r="1.75" fill="#F59E0B"/>
</svg>
