<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Synara Dashboard</title>
    <!-- Pre-paint theme bootstrap: reconcile the saved preference before
         first paint so a saved "light" choice doesn't flash the hardcoded
         dark default. Key/logic mirror theme-toggle.tsx (saved ?? "dark"). -->
    <script>
      try {
        var dark =
          localStorage.getItem("synara.dashboard.theme") !== "light";
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark
          ? "dark"
          : "light";
      } catch (e) {
        /* storage unavailable — hardcoded class="dark" remains the fallback */
      }
    </script>
    <script type="module" crossorigin src="./assets/index-DkCKsNut.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BfsH4F1U.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
