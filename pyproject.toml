[project]
name = "synara-mcp"
version = "0.1.0"
description = "MCP server exposing simplevecdb vector storage and semantic search."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bandit>=1.9.4",
    "fastmcp>=3.2.4",
    "httpx>=0.28",
    "mypy>=2.0.0",
    "peft>=0.19.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.15.12",
    # Capped below the next major: the memory feature reaches into
    # simplevecdb's private ``_collection`` (edges.upsert,
    # events.append/prune) for operations the async surface doesn't
    # expose. A major release may restructure those internals, which
    # would fail only at runtime, so block it at the dependency level
    # until the coupling is replaced with public API.
    "simplevecdb[server]>=2.6.0,<3",
]

[project.optional-dependencies]
# Parallel FastAPI admin console. Kept out of the default install so the
# core MCP server stays lean; the dashboard package is import-safe
# (stdlib-only __init__, FastAPI imported lazily) so a default install
# never loads these.
dashboard = [
    "fastapi>=0.136",
    "uvicorn>=0.46",
    "sse-starlette>=3.4",
]

[project.scripts]
synara-mcp = "synara.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synara"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["simplevecdb", "simplevecdb.*", "flash_attn", "sentence_transformers"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "slow: tests that download large models or otherwise hit the network",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
