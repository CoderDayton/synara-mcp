[project]
name = "synara-mcp"
version = "0.1.0"
description = "Persistent episodic and semantic memory for MCP agents, with relational recall and automatic forgetting."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.2.4",
    "httpx>=0.28",
    # Used directly and pervasively by the recall/consolidation maths.
    # Every current dependency happens to pull it in, but relying on a
    # transitive numpy would break the day one of them drops it.
    "numpy>=2.0",
    # NOT imported anywhere in src/ -- do not "clean up" as unused. The
    # default local model (``jinaai/jina-embeddings-v5-text-nano``) is
    # loaded with ``trust_remote_code=True``, and the modeling file
    # bundled in that repo imports peft at load time. Without it the
    # local backend dies with "This modeling file requires the following
    # packages that were not found in your environment: peft" on the
    # first encode. Only a remote-embedding deployment
    # (SYNARA_EMBEDDING_URL) never needs it.
    "peft>=0.19.1",
    # Local on-device embedding is the default mode (a remote endpoint is
    # opt-in via SYNARA_EMBEDDING_URL), so a default install must be able
    # to embed out of the box. The import stays lazy in
    # ``features/embedding/service.py`` so the package remains importable
    # on machines without torch — lint-only CI, or a remote-only
    # deployment that never loads a model.
    "sentence-transformers>=5.0",
    # Capped below the next major: the memory feature reaches into
    # simplevecdb's private ``_collection`` (edges.upsert,
    # events.append/prune) for operations the async surface doesn't
    # expose. A major release may restructure those internals, which
    # would fail only at runtime, so block it at the dependency level
    # until the coupling is replaced with public API.
    "simplevecdb[server]>=2.6.0,<3",
]

[project.optional-dependencies]
# Parallel FastAPI admin console. Kept out of the default install so the
# core MCP server stays lean; the dashboard package is import-safe
# (stdlib-only __init__, FastAPI imported lazily) so a default install
# never loads these.
dashboard = [
    "fastapi>=0.136",
    "uvicorn>=0.46",
    "sse-starlette>=3.4",
]

[dependency-groups]
# Tooling for the pre-commit/pre-push gate and CI. Deliberately NOT in
# ``dependencies``: `uvx synara-mcp` should install a memory server, not
# a test runner, two linters and a type checker. ``uv sync`` installs
# this group by default, which is what CI's ``uv sync --locked`` +
# ``uv run --frozen ruff|mypy|bandit|pytest`` relies on.
dev = [
    "bandit>=1.9.4",
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.15.12",
]

[project.scripts]
synara-mcp = "synara.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synara"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["simplevecdb", "simplevecdb.*", "flash_attn", "sentence_transformers"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "slow: tests that download large models or otherwise hit the network",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
