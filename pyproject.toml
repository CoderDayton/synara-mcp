[project]
name = "synara-mcp"
version = "0.1.0"
description = "Persistent episodic and semantic memory for MCP agents, with relational recall and automatic forgetting."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "mcp",
    "model-context-protocol",
    "memory",
    "embeddings",
    "llm",
    "agent",
    "vector-search",
    "fastmcp",
    "successor-representation",
]
# No ``License ::`` classifier: PyPI rejects those alongside the PEP 639
# ``license`` expression above.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=3.2.4",
    "httpx>=0.28",
    # Used directly and pervasively by the recall/consolidation maths.
    # Every current dependency happens to pull it in, but relying on a
    # transitive numpy would break the day one of them drops it.
    "numpy>=2.0",
    # Local on-device embedding is the default mode (a remote endpoint is
    # opt-in via SYNARA_EMBEDDING_URL), so a default install must be able
    # to embed out of the box. embed-anything is a Rust/ONNX runtime: it
    # replaced PyTorch + sentence-transformers here, taking site-packages
    # from ~5.1 GB to ~194 MB and dropping the 2.7 GB CUDA payload that
    # a CPU-only server never touched. It also retired
    # ``trust_remote_code`` — the previous default model executed
    # arbitrary Python from its Hugging Face repo on every load, and this
    # backend has no mechanism to do that.
    # The import stays lazy in ``features/embedding/service.py`` so the
    # package remains importable without the ONNX runtime (lint-only CI,
    # or a remote-only deployment that never loads a model).
    "embed-anything>=0.7.1",
    # Deliberately WITHOUT the [server] extra. That extra bundles the
    # standalone simplevecdb-server (fastapi + uvicorn +
    # sentence-transformers), and sentence-transformers is what dragged
    # PyTorch and the 2.7 GB CUDA payload into every install. We only
    # import AsyncVectorDB / AsyncVectorCollection / Quantization, all of
    # which are core. Anyone wanting simplevecdb-server as a remote
    # embedding endpoint runs it as its own install.
    # Capped below the next major: the memory feature reaches into
    # simplevecdb's private ``_collection`` (edges.upsert,
    # events.append/prune) for operations the async surface doesn't
    # expose. A major release may restructure those internals, which
    # would fail only at runtime, so block it at the dependency level
    # until the coupling is replaced with public API.
    "simplevecdb>=2.6.0,<3",
]

[project.optional-dependencies]
# Parallel FastAPI admin console. Kept out of the default install so the
# core MCP server stays lean; the dashboard package is import-safe
# (stdlib-only __init__, FastAPI imported lazily) so a default install
# never loads these.
dashboard = [
    "fastapi>=0.136",
    "uvicorn>=0.46",
    "sse-starlette>=3.4",
]

[dependency-groups]
# Tooling for the pre-commit/pre-push gate and CI. Deliberately NOT in
# ``dependencies``: `uvx synara-mcp` should install a memory server, not
# a test runner, two linters and a type checker. ``uv sync`` installs
# this group by default, which is what CI's ``uv sync --locked`` +
# ``uv run --frozen ruff|mypy|bandit|pytest`` relies on.
dev = [
    "bandit>=1.9.4",
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.15.12",
    # The dashboard tests import FastAPI. Its deps used to arrive by
    # accident, transitively through simplevecdb's [server] extra; once
    # that extra went away (it was what pulled in PyTorch) the dashboard
    # suite stopped collecting. Depend on our own extra explicitly so a
    # plain `uv sync` still produces a runnable test environment.
    "synara-mcp[dashboard]",
]

[project.urls]
Homepage = "https://github.com/CoderDayton/synara-mcp"
Repository = "https://github.com/CoderDayton/synara-mcp"
Issues = "https://github.com/CoderDayton/synara-mcp/issues"
Changelog = "https://github.com/CoderDayton/synara-mcp/blob/main/CHANGELOG.md"

[project.scripts]
synara-mcp = "synara.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synara"]

# The sdist contents are listed explicitly. Hatchling only reads the
# *root* ``.gitignore``, so ``dashboard/.gitignore`` is invisible to it:
# on any machine that has run `bun install`, an implicit sdist swept in
# ``dashboard/node_modules`` (13k files, 48 MB) plus untracked local
# junk like ``.claude/``. CI happened to build clean only because it
# never installs the JS deps — the tarball was a function of whose
# machine built it. Enumerate the inputs instead.
#
# Every pattern is anchored with a leading ``/``. These are gitignore-style
# globs: an unanchored ``README.md`` or ``docs`` matches that name at *any*
# depth, which pulled 1,060 files back out of ``node_modules`` (every
# vendored README and LICENSE) even with the directory itself unlisted.
[tool.hatch.build.targets.sdist]
include = [
    "/src/synara",
    "/tests",
    "/docs",
    "/scripts",
    "/assets",
    # Dashboard *sources* only, so the committed bundle stays
    # reproducible from the sdist; node_modules never ships.
    "/dashboard/src",
    "/dashboard/index.html",
    "/dashboard/package.json",
    "/dashboard/bun.lock",
    "/dashboard/components.json",
    "/dashboard/eslint.config.js",
    "/dashboard/vite.config.ts",
    "/dashboard/tsconfig*.json",
    "/dashboard/README.md",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
    "/lefthook.yml",
    "/.env.example",
]
exclude = ["**/node_modules"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["simplevecdb", "embed_anything"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "slow: tests that download large models or otherwise hit the network",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
