# Lefthook configuration. Install hooks once with: `lefthook install`.
# All commands run through `uv run --no-sync` so they use the project venv.

pre-commit:
  parallel: false
  jobs:
    - name: ruff-format
      glob: "*.py"
      run: uv run --no-sync ruff format {staged_files}
      stage_fixed: true

    - name: ruff-lint
      glob: "*.py"
      run: uv run --no-sync ruff check --fix {staged_files}
      stage_fixed: true

    - name: mypy
      run: uv run --no-sync mypy

    - name: bandit
      run: uv run --no-sync bandit -q -r src

    - name: dashboard-build-fresh
      run: uv run --no-sync python scripts/check_dashboard_build.py

    - name: dashboard-api-fresh
      run: bun --cwd dashboard run gen:api:check

    - name: dashboard-typecheck
      glob: "dashboard/**/*.{ts,tsx}"
      run: bun --cwd dashboard run typecheck

    - name: dashboard-lint
      glob: "dashboard/**/*.{ts,tsx}"
      run: bun --cwd dashboard run lint

    - name: dashboard-test
      glob: "dashboard/**/*.{ts,tsx}"
      run: bun --cwd dashboard run test

    - name: pytest
      run: uv run --no-sync pytest -q

pre-push:
  parallel: true
  jobs:
    - name: ruff-lint
      run: uv run --no-sync ruff check src tests

    - name: ruff-format
      run: uv run --no-sync ruff format --check src tests

    - name: mypy
      run: uv run --no-sync mypy

    - name: bandit
      run: uv run --no-sync bandit -q -r src

    - name: dashboard-build-fresh
      run: uv run --no-sync python scripts/check_dashboard_build.py

    - name: dashboard-api-fresh
      run: bun --cwd dashboard run gen:api:check

    - name: dashboard-typecheck
      run: bun --cwd dashboard run typecheck

    - name: dashboard-lint
      run: bun --cwd dashboard run lint

    - name: dashboard-test
      run: bun --cwd dashboard run test

    - name: pytest
      run: uv run --no-sync pytest
