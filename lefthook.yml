# Lefthook configuration. Install hooks once with: `lefthook install`.
# All commands run through `uv run --no-sync` so they use the project venv.

pre-commit:
  parallel: false
  jobs:
    - name: ruff-format
      glob: "*.py"
      run: uv run --no-sync ruff format {staged_files}
      stage_fixed: true

    - name: ruff-lint
      glob: "*.py"
      run: uv run --no-sync ruff check --fix {staged_files}
      stage_fixed: true

    - name: mypy
      run: uv run --no-sync mypy

    - name: bandit
      run: uv run --no-sync bandit -q -r src

    - name: pytest
      run: uv run --no-sync pytest -q

pre-push:
  parallel: true
  jobs:
    - name: ruff-lint
      run: uv run --no-sync ruff check src tests

    - name: ruff-format
      run: uv run --no-sync ruff format --check src tests

    - name: mypy
      run: uv run --no-sync mypy

    - name: bandit
      run: uv run --no-sync bandit -q -r src

    - name: pytest
      run: uv run --no-sync pytest
